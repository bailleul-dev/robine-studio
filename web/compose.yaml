services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: robine_amp
      POSTGRES_USER: robine
      POSTGRES_PASSWORD: robine
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robine -d robine_amp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - robine-postgres:/var/lib/postgresql/data

volumes:
  robine-postgres:
